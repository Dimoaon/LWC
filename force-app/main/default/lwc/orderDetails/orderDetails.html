<template>
    <div class="order-details">
        <div lwc:dom="manual" class="custom-css-container"></div>

        <div class="order-card">

            <!-- SPINNER -->
            <template lwc:if={isLoading}>
                <lightning-spinner
                    alternative-text={loadingLabel}
                    size="medium"
                ></lightning-spinner>
            </template>

            <template lwc:else>
                <div class="order__body">

                    <div class="order__main">

                        <!-- HEADER -->
                        <div class="order__header">
                            <lightning-button
                                variant="base"
                                icon-name="utility:back"
                                label={backToOrdersLabel}
                            ></lightning-button>

                            <div class="order__title">
                                {orderTitle}
                            </div>

                            <div class="order__placed">
                                <div class="order__placed-label">
                                    {placedOnLabel}
                                </div>

                                <lightning-formatted-date-time
                                    value={placedDate}
                                    year="numeric"
                                    month="short"
                                    day="numeric"
                                    hour="numeric"
                                    minute="2-digit"
                                ></lightning-formatted-date-time>
                            </div>
                        </div>

                        <!-- STATUS TIMELINE -->
                        <c-order-status-timeline
                            class="order__timeline"
                            status={status}
                            placed-date={placedDate}
                            placed-label={placedStepLabel}
                            processing-label={processingStepLabel}
                            shipped-label={shippedStepLabel}
                            delivered-label={deliveredStepLabel}
                            in-progress-label={inProgressLabel}
                            pending-label={pendingLabel}
                            cancelled-date={cancelledDate}
                            cancelled-title={cancelledTitle}
                            cancelled-message={cancelledMessage}
                        ></c-order-status-timeline>

                        <!-- ITEMS -->
                        <div class="order__items">
                            <div class="order__items-title">
                                {orderItemsTitle}
                            </div>

                            <template for:each={lineItems} for:item="lineItem">
                                <c-order-line-item-card
                                    key={lineItem.id}
                                    name={lineItem.name}
                                    sku={lineItem.sku}
                                    quantity={lineItem.quantity}
                                    line-total={lineItem.lineTotal}
                                    currency-iso-code={currencyIsoCode}
                                    sku-label={skuLabel}
                                    quantity-label={quantityLabel}
                                    price-label={priceLabel}
                                ></c-order-line-item-card>
                            </template>

                            <div class="order__invoice">
                                <lightning-button
                                    variant="neutral"
                                    icon-name="utility:file"
                                    label={downloadInvoiceLabel}
                                ></lightning-button>
                            </div>
                        </div>

                    </div>

                    <!-- SUMMARY -->
                    <c-order-summary-panel
                        class="order__summary"
                        oneditaddress={handleEditAddress}
                        onviewpayment={handleViewPayment}
                        subtotal={subtotal}
                        shipping={shipping}
                        tax={tax}
                        tax-rate={taxRate}
                        total={total}
                        currency-iso-code={currencyIsoCode}
                        summary-title={orderSummaryTitle}
                        subtotal-label={subtotalLabel}
                        shipping-label={shippingLabel}
                        tax-label={taxLabel}
                        total-label={totalLabel}
                        address={address}
                        country-name={countryName}
                        shipping-address-label={shippingAddressLabel}
                        edit-label={editLabel}
                        payment={payment}
                        payment-brand={paymentBrand}
                        card-text={cardText}
                        expires-text={expiresText}
                        paid-date={paidDate}
                        payment-method-label={paymentMethodLabel}
                        paid-label={paidLabel}
                        view-payment-details-label={viewPaymentDetailsLabel}
                        paid-in-full-label={paidInFullLabel}
                    ></c-order-summary-panel>

                </div>
            </template>

        </div>

        <!-- MODAL -->
        <c-modal onclose={handleModalClose} onconfirm={handleConfirm}>
            <div slot="content">

                <!-- PAYMENT DETAILS FORM -->
                <template lwc:if={showPaymentDetails}>
                    <div class="payment-form modal-form">
                        <lightning-select
                            label={cardTypeLabel}
                            name="brand"
                            value={paymentForm.brand}
                            options={brandOptions}
                            required
                            onchange={handlePaymentFormChange}
                        ></lightning-select>

                        <lightning-input
                            label={cardNumberLabel}
                            name="cardNumber"
                            value={paymentForm.cardNumber}
                            maxlength={maxLength.cardNumber}
                            pattern={cardNumberPattern}
                            message-when-pattern-mismatch={cardNumberValidationMessage}
                            required
                            onchange={handlePaymentFormChange}
                        ></lightning-input>

                        <lightning-select
                            label={statusLabel}
                            name="status"
                            value={paymentForm.status}
                            options={statusOptions}
                            required
                            onchange={handlePaymentFormChange}
                        ></lightning-select>

                        <lightning-input
                            label={transactionIdLabel}
                            name="transactionId"
                            value={paymentForm.transactionId}
                            required
                            onchange={handlePaymentFormChange}
                        ></lightning-input>

                        <div class="payment-form__amount">
                            <div class="payment-form__amount-label">
                                {amountLabel}
                            </div>

                            <div class="payment-form__amount-value">
                                <lightning-formatted-number
                                    value={total}
                                    format-style="currency"
                                    currency-code={currencyIsoCode}
                                ></lightning-formatted-number>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- EDIT ADDRESS FORM -->
                <template lwc:if={showAddressForm}>
                <div class="address-form modal-form">
                    <lightning-input
                        label={addressNameLabel}
                        name="name"
                        value={addressForm.name}
                        maxlength={maxLength.name}
                        required
                        message-when-value-missing={addressRequiredMessage}
                        onchange={handleFormChange}
                    ></lightning-input>

                    <!-- ADDRESS SEARCH -->
                    <div class="address-form__search">
                        <lightning-input-address
                            address-lookup-placeholder={addressSearchLabel}
                            show-address-lookup
                            onchange={handleAddressChange}
                        ></lightning-input-address>

                        <template lwc:if={showCountryError}>
                            <div class="address-form__error">
                                {countryErrorMessage}
                            </div>
                        </template>
                    </div>

                    <lightning-input
                        label={addressStreetLabel}
                        name="street"
                        value={addressForm.street}
                        maxlength={maxLength.street}
                        required
                        message-when-value-missing={addressRequiredMessage}
                        onchange={handleFormChange}
                    ></lightning-input>

                    <lightning-input
                        label={addressCityLabel}
                        name="city"
                        value={addressForm.city}
                        maxlength={maxLength.city}
                        required
                        message-when-value-missing={addressRequiredMessage}
                        onchange={handleFormChange}
                    ></lightning-input>

                    <lightning-select
                        label={addressCountryLabel}
                        name="countryCode"
                        value={addressForm.countryCode}
                        options={countryOptions}
                        required
                        message-when-value-missing={addressRequiredMessage}
                        onchange={handleFormChange}
                    ></lightning-select>

                    <lightning-select
                        label={addressStateLabel}
                        name="stateCode"
                        value={addressForm.stateCode}
                        options={stateOptions}
                        required={stateRequired}
                        disabled={stateDisabled}
                        message-when-value-missing={addressRequiredMessage}
                        onchange={handleFormChange}
                    ></lightning-select>

                    <lightning-input
                        label={addressPostalCodeLabel}
                        name="postalCode"
                        value={addressForm.postalCode}
                        maxlength={maxLength.postalCode}
                        pattern={postalCodePattern}
                        message-when-pattern-mismatch={postalCodeValidationMessage}
                        required
                        message-when-value-missing={addressRequiredMessage}
                        onchange={handleFormChange}
                    ></lightning-input>

                    <lightning-input
                        label={addressPhoneLabel}
                        name="phone"
                        value={addressForm.phone}
                        maxlength={maxLength.phone}
                        pattern={phonePattern}
                        message-when-pattern-mismatch={phoneValidationMessage}
                        required
                        message-when-value-missing={addressRequiredMessage}
                        onchange={handleFormChange}
                    ></lightning-input>
                </div>
                </template>

            </div>
        </c-modal>
    </div>
</template>
